services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zittosite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-zittosite}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zittosite}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-zittosite}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zittosite}
      DIRECT_URL: postgresql://${POSTGRES_USER:-zittosite}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zittosite}
      PORT: "4000"
      PAYMENT_SIMULATION: ${PAYMENT_SIMULATION:-1}
      WAHA_BASE_URL: ${WAHA_BASE_URL:-http://waha:3000}
    # PUBLIC_BIND_ADDR=127.0.0.1 (set by deploy.sh in TLS mode) keeps it behind Caddy.
    ports:
      - "${PUBLIC_BIND_ADDR:-0.0.0.0}:4000:4000"
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:4000}
        NEXT_PUBLIC_PAYMENT_SIMULATION: ${PAYMENT_SIMULATION:-1}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "${PUBLIC_BIND_ADDR:-0.0.0.0}:3000:3000"
    networks:
      - internal

  # HTTPS reverse proxy; only started with the "tls" profile (deploy.sh enables it when WEB_DOMAIN is set).
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:-}
      API_DOMAIN: ${API_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

  # WhatsApp gateway for group notifications; only started with the "waha" profile
  # (deploy.sh enables it when WAHA_API_KEY is set). Env comes from .env by
  # interpolation, never env_file, so WAHA does not see DB/JWT secrets.
  # Dashboard is localhost-only: ssh -L 3001:127.0.0.1:3001 <vps>
  waha:
    image: ${WAHA_IMAGE:-devlikeapro/waha:gows-2026.9.1}
    profiles: ["waha"]
    restart: unless-stopped
    environment:
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-}
      WHATSAPP_SWAGGER_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-}
      # Group messages → API (Roamercheck status updates). deploy.sh sets
      # WAHA_HOOK_URL only when WAHA_WEBHOOK_SECRET is configured.
      WHATSAPP_HOOK_URL: ${WAHA_HOOK_URL:-}
      WHATSAPP_HOOK_EVENTS: message
      WHATSAPP_HOOK_HMAC_KEY: ${WAHA_WEBHOOK_SECRET:-}
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - waha_sessions:/app/.sessions
    networks:
      - internal

volumes:
  waha_sessions:
  pgdata:
  caddy_config:
  caddy_data:

networks:
  internal:
    driver: bridge
