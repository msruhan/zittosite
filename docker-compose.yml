services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zittosite
      POSTGRES_PASSWORD: zittosite
      POSTGRES_DB: zittosite
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zittosite"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
