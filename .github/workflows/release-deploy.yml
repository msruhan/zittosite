name: "Release & Deploy"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump type"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      skip_deploy:
        description: "Only bump version (skip VPS deploy)"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Version bump & tag
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       !startsWith(github.event.head_commit.message, 'chore(release):'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Version bump & tag
        id: release
        run: |
          set -euo pipefail
          BUMP="${{ github.event.inputs.bump || 'patch' }}"
          CURRENT=$(node -p "require('./package.json').version")
          IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            *)     PATCH=$((PATCH + 1)) ;;
          esac
          NEXT="${MAJOR}.${MINOR}.${PATCH}"
          TAG="v${NEXT}"
          export NEXT_VERSION="$NEXT"

          node -e '
            const fs = require("fs");
            const next = process.env.NEXT_VERSION;
            for (const file of ["package.json", "apps/web/package.json", "apps/api/package.json"]) {
              if (!fs.existsSync(file)) continue;
              const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
              pkg.version = next;
              fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
            }
          '

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json apps/web/package.json apps/api/package.json
          git commit -m "chore(release): ${TAG}"
          git tag -a "$TAG" -m "Release ${TAG}"
          git push origin HEAD:main
          git push origin "$TAG"

          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Released ${TAG}"

  deploy:
    name: Deploy to VPS
    needs: version
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_deploy != 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 1

      - name: Setup SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "${VPS_SSH_PRIVATE_KEY}" || { echo "Missing secret VPS_SSH_PRIVATE_KEY"; exit 1; }
          test -n "${VPS_HOST}" || { echo "Missing secret VPS_HOST"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync files to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          HOST="$VPS_HOST"
          USER="${VPS_USER:-root}"
          DIR="${VPS_DEPLOY_PATH:-/opt/zittosite}"
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude 'dist' \
            --exclude '.env' \
            --exclude '.vercel' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            ./ "${USER}@${HOST}:${DIR}/"

      - name: Remote deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          HOST="$VPS_HOST"
          USER="${VPS_USER:-root}"
          DIR="${VPS_DEPLOY_PATH:-/opt/zittosite}"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "${USER}@${HOST}" \
            "DEPLOY_DIR='${DIR}' bash '${DIR}/scripts/deploy.sh'"

      - name: Summary
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          {
            echo "### Deployed ${{ needs.version.outputs.tag }}"
            echo "- Version: \`${{ needs.version.outputs.version }}\`"
            echo "- Host: \`${VPS_HOST}\`"
            echo "- Web: http://${VPS_HOST}:3000"
            echo "- API: http://${VPS_HOST}:4000/health"
          } >> "$GITHUB_STEP_SUMMARY"
